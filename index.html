<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Instagram Follower Analyzer</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #f9f9f9; color: #333; }
    h1 { text-align: center; }
    .upload-box { background: #fff; border: 2px dashed #ccc; border-radius: 8px; padding: 20px; margin-bottom: 20px; text-align: center; }
    .upload-box input { margin-top: 10px; }
    button { background: #0095f6; color: white; border: none; padding: 12px 24px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; }
    button:hover { background: #0074c7; }
    .results-container { display: flex; gap: 20px; margin-top: 30px; }
    .column { flex: 1; background: #fff; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .column h3 { border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 0; }
    ul { list-style: none; padding: 0; max-height: 400px; overflow-y: auto; }
    li { padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
    a { color: #0095f6; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .status-bar { background: #e7f3ff; border: 1px solid #b6d4fe; padding: 12px; border-radius: 6px; margin-bottom: 20px; display: none; text-align: center; color: #084298; }
  </style>
</head>
<body>

  <h1>Instagram Follower Analyzer</h1>
  <p style="text-align: center;">Processes 100% locally in your browser.</p>

  <div id="statusBar" class="status-bar"></div>

  <div class="upload-box">
    <label><strong>1. Upload <code>followers_1.json</code>:</strong></label><br>
    <input type="file" id="followersFile" accept=".json">
  </div>

  <div class="upload-box">
    <label><strong>2. Upload <code>following.json</code>:</strong></label><br>
    <input type="file" id="followingFile" accept=".json">
  </div>

  <button onclick="compareLists()">Analyze Follow Lists</button>

  <div class="results-container">
    <div class="column">
      <h3>Not Following You Back (<span id="notBackCount">0</span>)</h3>
      <ul id="notFollowingBackList"></ul>
    </div>
    <div class="column">
      <h3>You Don't Follow Back (<span id="youNotBackCount">0</span>)</h3>
      <ul id="youNotFollowingBackList"></ul>
    </div>
  </div>

  <script>
    async function parseJSON(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(JSON.parse(e.target.result));
        reader.onerror = reject;
        reader.readAsText(file);
      });
    }

    function extractUsernames(data) {
      const usernames = new Set();
      let list = [];

      if (Array.isArray(data)) {
        list = data;
      } else if (data && data.relationships_following) {
        list = data.relationships_following;
      } else if (data && data.relationships_followers) {
        list = data.relationships_followers;
      }

      list.forEach(item => {
        if (!item) return;

        // 1. Check title field (Exact match for your following.json)
        if (item.title && typeof item.title === 'string' && item.title.trim() !== '') {
          usernames.add(item.title.toLowerCase().trim());
        }
        // 2. Check string_list_data value field (Standard for followers_1.json)
        else if (item.string_list_data && item.string_list_data.length > 0) {
          const val = item.string_list_data[0].value;
          if (val) usernames.add(val.toLowerCase().trim());
        } 
      });

      return usernames;
    }

    async function compareLists() {
      const followersInput = document.getElementById('followersFile').files[0];
      const followingInput = document.getElementById('followingFile').files[0];

      if (!followersInput || !followingInput) {
        alert("Please select both JSON files first.");
        return;
      }

      try {
        const followersData = await parseJSON(followersInput);
        const followingData = await parseJSON(followingInput);

        const followers = extractUsernames(followersData);
        const following = extractUsernames(followingData);

        const statusBar = document.getElementById('statusBar');
        statusBar.style.display = 'block';
        statusBar.innerHTML = `<strong>Success!</strong> Found <b>${followers.size}</b> followers and <b>${following.size}</b> following accounts.`;

        if (followers.size === 0 || following.size === 0) {
          alert("Could not extract accounts. Please verify your files.");
          return;
        }

        // Calculate Set differences
        const notFollowingBack = [...following].filter(user => !followers.has(user));
        const youNotFollowingBack = [...followers].filter(user => !following.has(user));

        renderList('notFollowingBackList', 'notBackCount', notFollowingBack);
        renderList('youNotFollowingBackList', 'youNotBackCount', youNotFollowingBack);

      } catch (err) {
        alert("Error parsing JSON files.");
        console.error(err);
      }
    }

    function renderList(elementId, countId, usernames) {
      const ul = document.getElementById(elementId);
      document.getElementById(countId).innerText = usernames.length;
      ul.innerHTML = '';

      usernames.forEach(username => {
        const li = document.createElement('li');
        li.innerHTML = `<a href="https://instagram.com/${username}" target="_blank">@${username}</a>`;
        ul.appendChild(li);
      });
    }
  </script>
</body>
</html>
